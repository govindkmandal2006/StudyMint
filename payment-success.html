<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Successful | StudyMint</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-card {
            width: 100%;
            max-width: 550px;
            background: #ffffff;
            border-radius: 20px;
            padding: 55px 35px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }

        .success-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 25px;
            background: #4ade80;
            color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.25);
        }

        h1 {
            color: #16a34a;
            font-size: 32px;
            margin-bottom: 18px;
        }

        .message {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .download-btn,
        .home-btn {
            display: inline-block;
            text-decoration: none;
            border-radius: 9px;
            padding: 14px 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .download-btn {
            background: #2563eb;
            color: #ffffff;
            border: none;
            margin-bottom: 15px;
        }

        .download-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .home-btn {
            background: #ffffff;
            color: #2563eb;
            border: 1px solid #2563eb;
        }

        .home-btn:hover {
            background: #eff6ff;
        }

        .loading {
            color: #64748b;
            font-size: 15px;
            margin-top: 20px;
        }

        .error {
            color: #dc2626;
            font-size: 15px;
            margin-top: 20px;
        }

        @media (max-width: 500px) {

            .success-card {
                padding: 45px 22px;
            }

            h1 {
                font-size: 27px;
            }

            .download-btn,
            .home-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <h1>
            Payment Successful!
        </h1>

        <p class="message" id="courseMessage">
            Checking your payment...
        </p>

        <div id="downloadArea"></div>

        <div id="statusMessage"></div>

    </div>


    <script>

        const params = new URLSearchParams(window.location.search);

        const orderId = params.get("order_id");

        const courseMessage =
            document.getElementById("courseMessage");

        const downloadArea =
            document.getElementById("downloadArea");

        const statusMessage =
            document.getElementById("statusMessage");


        async function verifyPayment() {

            if (!orderId) {

                courseMessage.innerText =
                    "Payment information could not be found.";

                statusMessage.innerHTML = `
                    <p class="error">
                        Invalid order.
                    </p>
                `;

                return;
            }


            try {

                const response =
                    await fetch(`/verify-payment/${orderId}`);

                const data =
                    await response.json();


                if (data.success) {

                    const course =
                        data.course || "your course";


                    courseMessage.innerText =
                        `Your ${course} Solved Assignment is ready.`;


                    downloadArea.innerHTML = `

                        <a
                            href="/download-assignment/${orderId}"
                            class="download-btn"
                        >
                            Download Assignment
                        </a>

                        <br>

                        <a
                            href="index.html"
                            class="home-btn"
                        >
                            ← Back to Home
                        </a>

                    `;

                } else {

                    courseMessage.innerText =
                        "Your payment could not be verified yet.";

                    statusMessage.innerHTML = `
                        <p class="error">
                            Please wait a moment and try again.
                        </p>

                        <br>

                        <a
                            href="index.html"
                            class="home-btn"
                        >
                            ← Back to Home
                        </a>
                    `;

                }

            } catch (error) {

                courseMessage.innerText =
                    "Something went wrong while verifying your payment.";

                statusMessage.innerHTML = `
                    <p class="error">
                        Please try again later.
                    </p>

                    <br>

                    <a
                        href="index.html"
                        class="home-btn"
                    >
                        ← Back to Home
                    </a>
                `;

            }

        }


        verifyPayment();

    </script>

</body>
</html>
