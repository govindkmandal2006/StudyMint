<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Successful | StudyMint</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f7fb;
    color: #172033;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    background: white;
    width: 90%;
    max-width: 550px;
    padding: 45px 30px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

.icon {
    font-size: 60px;
    margin-bottom: 15px;
}

h1 {
    color: #16a34a;
    margin-bottom: 15px;
}

p {
    color: #64748b;
    line-height: 1.6;
    margin-bottom: 10px;
}

.download {
    display: none;
    margin-top: 20px;
    padding: 14px 25px;
    background: #2563eb;
    color: white;
    text-decoration: none;
    border-radius: 9px;
}

.download:hover {
    background: #1d4ed8;
}

</style>

</head>

<body>

<div class="card">

    <div class="icon" id="icon">⏳</div>

    <h1 id="title">
        Verifying Payment...
    </h1>

    <p id="message">
        Please wait while we verify your payment.
    </p>

    <a
        href="#"
        class="download"
        id="download"
        target="_blank"
    >
        Download Assignment
    </a>

</div>


<script>

async function verifyPayment() {

    const params =
        new URLSearchParams(window.location.search);

    const orderId =
        params.get("order_id");


    if (!orderId) {

        showFailed("Invalid payment order.");

        return;

    }


    try {

        const response = await fetch(
            "/verify-payment/" +
            encodeURIComponent(orderId)
        );


        const data =
            await response.json();


        if (data.success === true) {

            const course =
                data.course || "BPSC-105";


            document.getElementById("icon")
                .innerText = "✅";


            document.getElementById("title")
                .innerText = "Payment Successful!";


            document.getElementById("message")
                .innerText =
                "Your " +
                course +
                " Solved Assignment is ready.";


            const downloadButton =
                document.getElementById("download");


            downloadButton.href =
                "/download-assignment/" +
                encodeURIComponent(orderId);


            downloadButton.style.display =
                "inline-block";


        } else {

            showFailed(
                "Payment was not completed successfully."
            );

        }


    } catch (error) {

        console.error(error);


        showFailed(
            "Unable to verify payment. Please try again."
        );

    }

}


function showFailed(message) {

    document.getElementById("icon")
        .innerText = "❌";


    document.getElementById("title")
        .innerText = "Payment Not Verified";


    document.getElementById("message")
        .innerText = message;

}


verifyPayment();

</script>


</body>

</html>
