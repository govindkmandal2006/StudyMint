<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment | StudyMint</title>

    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .payment-card {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            color: #2563eb;
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        .course-box {
            background: #eff6ff;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
        }

        .course-code {
            font-size: 22px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 8px;
        }

        .course-name {
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
        }

        .price {
            margin-top: 12px;
            color: #2563eb;
            font-size: 25px;
            font-weight: 800;
        }

        label {
            display: block;
            color: #374151;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #2563eb;
        }

        .pay-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .pay-btn:hover {
            background: #1d4ed8;
        }

        .pay-btn:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 18px;
            text-decoration: none;
            color: #2563eb;
            font-size: 14px;
            font-weight: 600;
        }

        .message {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .error {
            color: #dc2626;
        }

        .loading {
            color: #64748b;
        }

        @media (max-width: 500px) {
            .payment-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="payment-card">

        <div class="logo">
            StudyMint
        </div>


        <div class="course-box">

            <div
                class="course-code"
                id="courseCode"
            >
                Loading...
            </div>

            <div
                class="course-name"
                id="courseName"
            >
                Please wait...
            </div>

            <div class="price">
                ₹29
            </div>

        </div>


        <form id="paymentForm">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <button
                type="submit"
                class="pay-btn"
                id="payBtn"
            >
                Pay ₹29
            </button>

        </form>


        <a
            href="index.html"
            class="back-btn"
        >
            ← Back to Home
        </a>


        <div
            id="message"
            class="message"
        ></div>

    </div>


    <script>

        /* =====================================
           COURSE INFORMATION
        ===================================== */

        const courses = {

            "BPSC-104": {
                name: "भारतीय राजनीतिक प्रक्रिया"
            },

            "BPSC-105": {
                name: "तुलनात्मक सरकार और राजनीति का परिचय"
            },

            "BSOM-162": {
                name: "भारतीय समाज समझ"
            },

            "BSSS-183": {
                name: "जीवन कौशल जानकारियाँ"
            },

            "BHDAE-182": {
                name: "BHDAE-182"
            }

        };


        /* =====================================
           GET COURSE FROM URL
        ===================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const requestedCourse =
            params.get("course");


        const courseCode =
            requestedCourse
                ? requestedCourse.toUpperCase()
                : "";


        const course =
            courses[courseCode];


        const courseCodeElement =
            document.getElementById(
                "courseCode"
            );

        const courseNameElement =
            document.getElementById(
                "courseName"
            );

        const paymentForm =
            document.getElementById(
                "paymentForm"
            );

        const payBtn =
            document.getElementById(
                "payBtn"
            );

        const message =
            document.getElementById(
                "message"
            );


        /* =====================================
           INVALID COURSE
        ===================================== */

        if (!course) {

            courseCodeElement.innerText =
                "Course Not Found";

            courseNameElement.innerText =
                "Please select a valid course.";

            paymentForm.style.display =
                "none";

        } else {

            courseCodeElement.innerText =
                courseCode;

            courseNameElement.innerText =
                course.name;

            document.title =
                `${courseCode} Payment | StudyMint`;

        }


        /* =====================================
           PAYMENT
        ===================================== */

        paymentForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                if (!course) {
                    return;
                }


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                if (!email) {

                    message.innerText =
                        "Please enter your email.";

                    message.className =
                        "message error";

                    return;
                }


                payBtn.disabled = true;

                payBtn.innerText =
                    "Creating Payment...";


                message.innerText =
                    "Please wait...";

                message.className =
                    "message loading";


                try {

                    /* CREATE ORDER */

                    const response =
                        await fetch(
                            "/create-order",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        email: email,
                                        course: courseCode
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.error ||
                            "Unable to create order."
                        );

                    }


                    /* CASHFREE */

                    const cashfree =
                        Cashfree({
                            mode: "sandbox"
                        });


                    await cashfree.checkout({

                        paymentSessionId:
                            data.payment_session_id,

                        redirectTarget:
                            "_self"

                    });


                } catch (error) {

                    console.error(error);


                    message.innerText =
                        error.message ||
                        "Something went wrong.";

                    message.className =
                        "message error";


                    payBtn.disabled = false;

                    payBtn.innerText =
                        "Pay ₹29";

                }

            }
        );

    </script>

</body>
</html>
